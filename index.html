<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El mismo clima, distintas oportunidades</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f4;--ink:#1d2b3a;--panel:#fff;--mute:#51606e;--p1:#2a9d8f;--p2:#e9a23b;--bad:#d64535;--good:#2f9e55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--ink:#e9eef2;--panel:#1a2733;--mute:#a4b2bf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--ink:#e9eef2;--panel:#1a2733;--mute:#a4b2bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.45 'Fredoka',system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px;display:grid;gap:12px}
h1{font-size:15px;margin:0;color:var(--mute);font-weight:500}
h2{font-size:26px;line-height:1.15;margin:0}
p{margin:0}
.o{stroke:#1d2b3a;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg{display:block;width:100%;height:auto}
.art{border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.hud{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center;font-size:16px}
.hud b{padding:2px 10px;border-radius:99px;color:#1d2b3a;background:var(--c)}
.bar{display:grid;gap:2px}
.bar i{display:block;height:10px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:var(--panel)}
.bar u{display:block;height:100%;transition:width .5s}
.opts{display:grid;gap:10px}
button{font:inherit;text-align:left;color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:11px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:grid;gap:2px}
button:hover:not(:disabled){transform:translateY(-2px)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--p2);outline-offset:3px}
button:disabled{cursor:default;box-shadow:none;transform:none}
button.lock{border-style:dashed;opacity:.65}
button.pick{background:var(--c);color:#1d2b3a}
button small{font-size:15px;color:var(--bad)}
button.go{justify-self:end;background:var(--ink);color:var(--bg);text-align:center}
.res{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.chip{display:inline-block;font-size:15px;padding:1px 9px;border-radius:99px;border:2px solid var(--ink);margin-right:6px}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.chip.good{background:var(--good);color:#fff;border-color:var(--good)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards button{padding:8px;text-align:center}
.cards .art{box-shadow:none;border-width:2px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:2px solid var(--mute);text-align:left}
.q{font-size:21px;font-weight:700}
.nt{font-size:14px;color:var(--mute)}
/* animaciones */
.an{transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@keyframes heat{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
@keyframes fall{0%{transform:translate(6px,-24px);opacity:0}15%{opacity:1}100%{transform:translate(-24px,64px);opacity:0}}
@keyframes flash{0%,84%,100%{opacity:0}86%{opacity:1}89%{opacity:.15}92%{opacity:1}96%{opacity:0}}
@keyframes wave{to{transform:translateX(-40px)}}
@keyframes bobw{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes swayk{0%,100%{transform:rotate(calc(var(--r,2deg)*-1))}50%{transform:rotate(var(--r,2deg))}}
@keyframes idle{to{transform:translateY(-1.5px)}}
@keyframes sweat{0%{transform:translateY(-2px);opacity:1}100%{transform:translateY(24px);opacity:0}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes hit{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.spin{animation:spin 20s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.rays{animation:glow 3s ease-in-out infinite}
.drift{animation:drift 7s ease-in-out infinite}
.heat{animation:heat 2.4s ease-out infinite}
.rain{animation:fall .9s linear infinite}
.flash{animation:flash 4s infinite}
.wv{animation:wave 3s linear infinite}
.wv2{animation:wave 5s linear infinite reverse}
.bobw{animation:bobw 3.5s ease-in-out infinite}
.pbob{transform-origin:50% 100%;animation:hop .9s ease-in-out infinite}
.ptired{transform-origin:50% 100%;--r:1.5deg;animation:swayk 2.4s ease-in-out infinite}
.pslump{transform-origin:50% 100%;--r:4deg;animation:swayk 3s ease-in-out infinite}
.sway{transform-origin:50% 100%;--r:2deg;animation:swayk 4s ease-in-out infinite}
.idle{animation:idle .3s linear infinite alternate}
.sweat{animation:sweat 1.6s ease-in infinite}
.blink{animation:blink 4s infinite}
.twk{animation:twinkle 2s ease-in-out infinite}
.art.hit{animation:hit .4s}
.res{animation:pop .3s ease-out}

@media (max-width:480px){body{font-size:17px}h2{font-size:23px}.hud{grid-template-columns:1fr 1fr}.hud b{grid-column:1/3;justify-self:start}}
</style>
</head>
<body>
<main>
<h1>El mismo clima, distintas oportunidades</h1>
<div class="hud" id="hud" hidden></div>
<div id="app"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const SK=['#1f2c4d','#f6b24a','#4b5568','#8aa0b3','#bfe0ee'];
const FX=[['moon','heat'],['sun','heat'],['cloud','rain','bolt'],['cloud','rain','flood'],['sunlow']];
const NM=['Persona 1','Persona 2'],DS=['Ingresos altos, casa sólida, auto y seguro.','Barrio popular, casa de chapa, trabajo informal.'];
// opciones: [texto, salud, ahorro, resultado, motivo de bloqueo]
const SC=[
{t:'Madrugada de calor',tx:['Son las 2 a. m. y la ola de calor no da tregua: afuera hay 34 °C. ¿Cómo dormís?','Son las 2 a. m. y la ola de calor no da tregua. El techo de chapa devuelve todo el calor acumulado. ¿Cómo dormís?'],o:[
 [['Prendés el aire acondicionado',5,-2,'Dormís a 23 °C y descansás perfecto. La factura apenas se nota.'],['Abrís ventanas y ponés el ventilador',0,0,'Alcanza. Dormís bastante bien.'],['Te das una ducha fría',2,0,'Te refrescás y dormís sin problema.']],
 [['Ventilador y a aguantar',-6,0,'Mueve aire caliente. Dormís dos horas.'],['Dormir en la vereda con los vecinos',-4,0,'Hay algo de brisa, pero también mosquitos e inseguridad.'],['Prender el aire acondicionado',0,0,'','No tenés, ni podrías pagar la luz.']]]},
{t:'La mañana: 40 °C',tx:['Amanece a 40 °C y tenés que cumplir con tu trabajo.','Amanece a 40 °C. Vendés en la calle: si no salís, no cobrás.'],o:[
 [['Hacés home office con aire',0,0,'Trabajás cómodo y cobrás igual.'],['Vas en tu auto climatizado',0,-2,'Llegás fresco. Gastás algo de nafta.'],['Pedís el día',1,0,'Tu trabajo lo permite sin descuentos.']],
 [['Salir igual, bajo el sol',-14,8,'Ganás el día, pero terminás mareado.'],['Quedarte en casa',-4,-8,'Perdés el jornal y adentro hay 38 °C.'],['Trabajar desde casa',0,0,'','Tu trabajo no se puede hacer a distancia.']]]},
{t:'Alerta naranja',tx:['A la tarde cae una tormenta fuerte y se corta la luz. En tu barrio hay desagües pluviales que funcionan.','A la tarde cae una tormenta fuerte y se corta la luz. En tu cuadra no hay desagües y el agua empieza a subir.'],o:[
 [['Esperar adentro con el generador',0,0,'Todo sigue andando. Ni te enterás.'],['Dejar el reclamo hecho en el seguro',0,0,'Por las dudas. Quedó registrado.'],['Salir a mirar la tormenta',-1,0,'Te mojás un poco. Nada grave.']],
 [['Subir lo importante a la mesa',-2,-5,'Salvás algunas cosas. Otras no.'],['Ir a lo de un familiar en remís',-1,-6,'Quedás a salvo, pero la casa queda sola.'],['Llamar al seguro',0,0,'','No tenés seguro.']]]},
{t:'El agua llega',tx:['La tormenta dejó la calle inundada. El agua llega hasta el jardín, pero a la casa no entra.','La tormenta dejó la calle inundada y el agua entra a la casa. Se mojan el colchón, la heladera y la garrafa.'],o:[
 [['Reclamar al seguro por el jardín',0,0,'Te cubren todo en pocos días.'],['Limpiar el desagüe del patio',-1,0,'Sacás las hojas que lo tapaban y el agua drena enseguida. Un poco de esfuerzo, sin daños.'],['Esperar a que baje',0,0,'Baja en horas. Listo.']],
 [['Pedir ayuda al municipio',-2,-4,'Te anotan en una lista. Responden en semanas.'],['Pedir un préstamo para reponer lo que se mojó',-1,-14,'Comprás un colchón y una heladera usados, pero quedás debiendo con tasas altas.'],['Reclamar al seguro',0,0,'','No tenés seguro.']]]},
{t:'Semanas después',tx:['Pasaron dos días y todo volvió a la normalidad. ¿Qué hacés?','Pasaron semanas y todavía hay humedad en las paredes y cuotas por pagar. ¿Qué hacés?'],o:[
 [['Volver a la rutina',1,0,'Todo igual que antes de la tormenta.'],['Ahorrar un poco más',0,3,'Sumás un poco más al ahorro del mes. Ni lo notás.'],['Arreglar el jardín',0,-1,'Pagás a alguien para que lo deje prolijo después de la tormenta. Cuesta poco.']],
 [['Hacer doble turno',-8,14,'Reponés plata, pero llegás agotado.'],['Vivir con la humedad',-5,0,'Se cae el revoque de la pared. No podés pagar los arreglos.'],['Acudir a una olla popular',2,6,'La solidaridad ayuda, pero no reemplaza las obras de infraestructura que se perdieron en la catástrofe.']]]}
];
SC.splice(2,1);SC.splice(0,1);const AI=[1,3,4];let st,res=[null,null];
function art(p,i,s=100){
 const c=p?'#e9a23b':'#2a9d8f',f=FX[i],cx=300;let x=`<svg viewBox="0 0 400 220" role="img" aria-label="Ilustración de la escena"><rect width="400" height="220" fill="${SK[i]}"/>`;
 if(f.includes('moon'))x+=`<circle class="o an pulse" cx="340" cy="45" r="22" fill="#fdf3c8"/>`+[[60,30],[130,70],[200,25],[260,60],[40,90]].map(([a,b],k)=>`<circle class="twk" style="animation-delay:-${k*.4}s" cx="${a}" cy="${b}" r="2" fill="#fff"/>`).join('');
 if(f.includes('sun'))x+=`<g class="rays"><g class="an spin" style="animation-duration:18s">${Array.from({length:12},(_,k)=>`<path d="M330 6v-5" stroke="#ffb02e" stroke-width="4" stroke-linecap="round" transform="rotate(${k*30} 330 45)"/>`).join('')}</g></g><g class="an spin" style="animation-duration:30s;animation-direction:reverse"><circle cx="330" cy="45" r="36" fill="none" stroke="#ff8a3d" stroke-width="4" stroke-dasharray="3 9"/></g><circle class="o an pulse" cx="330" cy="45" r="24" fill="#ffd23f"/>`;
 if(f.includes('sunlow'))x+=`<g class="rays"><g class="an spin" style="animation-duration:36s">${Array.from({length:14},(_,k)=>`<path d="M320 26v-14" stroke="#fff3b0" stroke-width="3" stroke-linecap="round" opacity=".8" transform="rotate(${k*360/14} 320 60)"/>`).join('')}</g></g><circle class="o an pulse" cx="320" cy="60" r="20" fill="#fff3b0"/>`;
 if(f.includes('cloud'))x+=`<g class="o an drift" fill="#2f3644"><ellipse cx="80" cy="42" rx="50" ry="22"/></g><g class="o an drift" style="animation-duration:9s;animation-delay:-3s" fill="#2f3644"><ellipse cx="170" cy="50" rx="60" ry="24"/></g><g class="o an drift" style="animation-duration:8s;animation-delay:-5s" fill="#2f3644"><ellipse cx="270" cy="38" rx="52" ry="22"/></g>`;
 x+=`<rect y="170" width="400" height="50" fill="${p?'#b68359':'#5aa469'}"/><path d="M0 170H400" class="o"/>`;
 if(p){x+=`<rect class="o" x="30" y="115" width="110" height="55" fill="#c28d5c"/><polygon class="o" points="22,115 85,90 148,115" fill="#9aa3ab"/><rect class="o" x="100" y="135" width="20" height="35" fill="#5a3d28"/><rect class="o" x="48" y="130" width="22" height="18" fill="#f3d27a"/>`}
 else{x+=`<rect class="o" x="30" y="100" width="130" height="70" fill="#f3ede0"/><polygon class="o" points="20,100 95,58 170,100" fill="#2f4a7a"/><rect class="o" x="45" y="115" width="28" height="26" fill="#9fd4ea"/><rect class="o" x="120" y="125" width="26" height="45" fill="#8a5a3a"/><rect class="o" x="82" y="112" width="30" height="14" fill="#dfe7ea"/><circle cx="90" cy="119" r="3" fill="#2a9d8f"/><g class="an sway"><rect class="o" x="362" y="120" width="10" height="50" fill="#6b4a2f"/><circle class="o" cx="367" cy="105" r="28" fill="#3f8f5b"/></g>`}
 if(f.includes('heat'))for(let k=0;k<3;k++)x+=`<path class="heat" style="animation-delay:-${k*.8}s" d="M${30+k*90} ${p?80:48}q9-12 18 0t18 0t18 0t18 0t18 0" fill="none" stroke="#ff5a3c" stroke-width="3.5" stroke-linecap="round"/>`;
 if(i==1)x+='<g class="an idle">'+(p?`<rect class="o" x="190" y="138" width="50" height="30" fill="#e0702c"/><circle class="o" cx="200" cy="170" r="6" fill="#444"/><circle class="o" cx="232" cy="170" r="6" fill="#444"/>`:`<rect class="o" x="175" y="146" width="80" height="22" rx="8" fill="#cfd8e0"/><rect class="o" x="190" y="132" width="48" height="18" rx="6" fill="#9fd4ea"/><circle class="o" cx="195" cy="170" r="8" fill="#444"/><circle class="o" cx="236" cy="170" r="8" fill="#444"/>`)+'</g>';
 if(f.includes('flood')){const y=p?(i==3?148:186):(i==3?204:220),w='q10-6 20 0t20 0'.repeat(13);x+=`<g class="an bobw"><path class="wv" d="M-40 ${y}${w}V240H-40z" fill="#3d8bff" fill-opacity=".6" stroke="#1d2b3a" stroke-width="3"/><path class="wv2" d="M-40 ${y+9}${w}V240H-40z" fill="#fff" fill-opacity=".18"/></g>`}
 else if(f.includes('rain')&&p&&i==2)x+=`<rect x="0" y="190" width="400" height="30" fill="#3d8bff" opacity=".55"/>`;
 x+=`<g class="an ${s>66?'pbob':s>33?'ptired':'pslump'}"><g class="o"><path d="M${cx-8} 160v10M${cx+8} 160v10" stroke="#2b2b3a"/><rect x="${cx-12}" y="135" width="24" height="28" rx="7" fill="${c}"/><circle cx="${cx}" cy="122" r="14" fill="#f1c9a0"/><path d="M${cx-14} 120a14 14 0 0 1 28 0z" fill="#3b2a20"/></g>`;
 x+=`<circle class="an blink" cx="${cx-5}" cy="124" r="2" fill="#1d2b3a"/><circle class="an blink" cx="${cx+5}" cy="124" r="2" fill="#1d2b3a"/><path d="${s>66?`M${cx-5} 129q5 5 10 0`:s>33?`M${cx-5} 130h10`:`M${cx-5} 132q5-5 10 0`}" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/>`;
 if(s<75&&i<2)x+=`<path class="sweat" d="M${cx+18} 112q-4 6 0 8q4-2 0-8" fill="#6ec1ff"/><path class="sweat" style="animation-delay:-.8s" d="M${cx-20} 116q-4 6 0 8q4-2 0-8" fill="#6ec1ff"/>`;x+='</g>';
 if(f.includes('rain'))for(let k=0;k<26;k++){const a=(k*37)%400,b=(k*53)%170;x+=`<path class="rain" style="animation-delay:-${(k*.13).toFixed(2)}s" d="M${a} ${b}l-6 16" stroke="#cfe4ff" stroke-width="2" stroke-linecap="round"/>`}
 if(f.includes('bolt'))x+=`<g class="flash"><polygon class="o" points="250,60 232,95 248,95 238,125 268,84 252,84 262,60" fill="#ffd23f"/></g>`;
 return x+'</svg>'}
function hud(){const h=$('hud'),c=st.p?'var(--p2)':'var(--p1)';h.hidden=false;
 h.innerHTML=`<b style="--c:${c}">${NM[st.p]}</b><div class="bar">Salud<i><u style="width:${st.s}%;background:${st.s>50?'var(--good)':st.s>25?'var(--p2)':'var(--bad)'}"></u></i></div><div class="bar">${st.a<0?'Ahorro: deuda':'Ahorro'}<i><u style="width:${st.a<0?100:st.a}%;background:${st.a<0?'var(--bad)':'var(--p1)'}"></u></i></div>`}
function intro(){$('hud').hidden=true;$('app').innerHTML=`<h2>Una ola de calor, una tormenta y lo que viene después</h2><p>Dos personas viven lo mismo en la misma ciudad. Elegí una y tomá sus decisiones. Después probá con la otra y compará.</p><div class="cards">${[0,1].map(p=>`<button data-p="${p}"><div class="art">${art(p,1)}</div><b>${NM[p]}</b><span>${DS[p]}</span>${res[p]?'<small style="color:var(--good)">Ya la jugaste</small>':''}</button>`).join('')}</div>`;
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>begin(+b.dataset.p))}
function begin(p){st={p,i:0,s:100,a:p?30:100,lk:0,tot:0};scene()}
function scene(){const c=SC[st.i],os=c.o[st.p];st.tot+=os.length;st.lk+=os.filter(o=>o[4]).length;hud();
 $('app').innerHTML=`<div class="art" id="art">${art(st.p,AI[st.i],st.s)}</div><h2>${c.t}</h2><p>${c.tx[st.p]}</p><div class="opts" id="opts">${os.map((o,k)=>`<button data-k="${k}" class="${o[4]?'lock':''}" ${o[4]?'disabled':''}>${o[0]}${o[4]?`<small>Bloqueada: ${o[4]}</small>`:''}</button>`).join('')}</div><div id="res"></div>`;
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){const o=SC[st.i].o[st.p][k],ch=(n,l)=>n?`<span class="chip ${n>0?'good':'bad'}">${l} ${n>0?'+':''}${n}</span>`:'';
 st.s=Math.max(0,Math.min(100,st.s+o[1]));st.a=Math.max(-60,Math.min(100,st.a+o[2]));
 document.querySelectorAll('#opts button').forEach((b,j)=>{b.disabled=true;if(j==k){b.classList.add('pick');b.style.setProperty('--c',st.p?'var(--p2)':'var(--p1)')}});
 $('art').innerHTML=art(st.p,AI[st.i],st.s);if(o[1]<0)$('art').classList.add('hit');hud();
 const last=st.i==SC.length-1;
 $('res').innerHTML=`<div class="res"><p>${o[3]}</p><div>${ch(o[1],'Salud')}${ch(o[2],'Ahorro')}${!o[1]&&!o[2]?'<span class="chip">Sin cambios</span>':''}</div><button class="go" id="nx">${last?'Ver el final':'Seguir'}</button></div>`;
 $('nx').onclick=()=>{if(last)fin();else{st.i++;scene();scrollTo(0,0)}};$('nx').focus()}
function fin(){res[st.p]={s:st.s,a:st.a,lk:st.lk,tot:st.tot};const o=1-st.p,both=res[0]&&res[1],f=n=>n<0?'Deuda '+Math.abs(n):n;
 $('hud').hidden=true;
 $('app').innerHTML=`<div class="art">${art(st.p,4,st.s)}</div><h2>Terminó la semana</h2><p>${NM[st.p]} terminó con salud ${st.s} y ${st.a<0?'una deuda de '+Math.abs(st.a):'ahorros de '+st.a}. ${st.lk?`De ${st.tot} opciones, ${st.lk} estaban bloqueadas por falta de recursos.`:'Ninguna opción estuvo bloqueada por falta de recursos.'}</p>
 ${both?`<table><tr><th></th><th>Persona 1</th><th>Persona 2</th></tr><tr><td>Salud</td><td>${res[0].s}</td><td>${res[1].s}</td></tr><tr><td>Ahorro</td><td>${f(res[0].a)}</td><td>${f(res[1].a)}</td></tr><tr><td>Opciones bloqueadas</td><td>${res[0].lk}</td><td>${res[1].lk}</td></tr></table>`:`<p>Pero esto es solo la mitad de la historia. ¿Qué le habría pasado a ${NM[o]} con el mismo clima?</p>`}
 ${both?'<p class="q">El clima golpea a todos, pero no nos trata por igual. ¿Por qué la misma tormenta deja a algunos con un susto y a otros con graves problemas?</p>':''}
 <div class="opts"><button id="oth">${both?'Jugar de nuevo':'Jugar como '+NM[o]}</button></div><p class="nt">Simulación ilustrativa basada en el ensayo. Los valores no son datos reales.</p>`;
 $('oth').onclick=()=>both?intro():begin(o);scrollTo(0,0)}
intro();
</script>
</body>
</html>
